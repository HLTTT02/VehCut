services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: [postgres-data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Host port 8001 avoids conflict with another local project using 8000.
    ports: ["8001:8000"]
    volumes: [vehcut-storage:/data/vehcut]

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --pool=solo --concurrency=1
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - vehcut-storage:/data/vehcut
      - model-cache:/models

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend: { condition: service_started }
    ports: ["5173:80"]
    volumes: [vehcut-storage:/data/vehcut:ro]

volumes:
  postgres-data:
  vehcut-storage:
  model-cache:
