server {
  listen 80;
  # Video uploads are proxied to FastAPI. Nginx defaults to roughly 1 MB,
  # which produces HTTP 413 before the API controller receives the file.
  client_max_body_size 2g;
  root /usr/share/nginx/html;
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }
  location /api/ { proxy_pass http://backend:8000/api/; }
  location /health { proxy_pass http://backend:8000/health; }
  location /storage/ { alias /data/vehcut/; }
}
